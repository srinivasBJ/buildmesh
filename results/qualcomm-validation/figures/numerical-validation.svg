<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="370" viewBox="0 0 1080 370" role="img" aria-labelledby="title desc"><title id="title">Reference versus Qualcomm numerical validation</title><desc id="desc">Directly labeled output-comparison metrics for the Midas V2 reference and hosted Qualcomm output.</desc><style>.bg{fill:#fff}.title{font:600 22px system-ui,sans-serif;fill:#0f172a}.sub{font:14px system-ui,sans-serif;fill:#475569}.card{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.5;rx:10}.metric{font:600 14px system-ui,sans-serif;fill:#0f172a}.number{font:600 25px ui-monospace,SFMono-Regular,monospace;fill:#0f766e}.threshold{font:13px system-ui,sans-serif;fill:#475569}.note{font:12px system-ui,sans-serif;fill:#64748b}</style><rect class="bg" width="1080" height="370"/><text class="title" x="48" y="42">Reference vs Qualcomm Output Validation</text><text class="sub" x="48" y="67">Same real RGB input · float32 output shape [1, 1, 256, 256] · values are not accuracy percentages</text><rect x="48" y="116" width="220" height="166" class="card"/><text x="158" y="150" class="metric" text-anchor="middle">Pearson correlation</text><text x="158" y="205" class="number" text-anchor="middle">0.99999566</text><text x="158" y="244" class="threshold" text-anchor="middle">&gt;= 0.999</text><rect x="298" y="116" width="220" height="166" class="card"/><text x="408" y="150" class="metric" text-anchor="middle">Normalized RMSE</text><text x="408" y="205" class="number" text-anchor="middle">0.0019748688</text><text x="408" y="244" class="threshold" text-anchor="middle">&lt;= 0.01</text><rect x="548" y="116" width="220" height="166" class="card"/><text x="658" y="150" class="metric" text-anchor="middle">Mean absolute error</text><text x="658" y="205" class="number" text-anchor="middle">1.5730768</text><text x="658" y="244" class="threshold" text-anchor="middle">reported</text><rect x="798" y="116" width="220" height="166" class="card"/><text x="908" y="150" class="metric" text-anchor="middle">Maximum absolute error</text><text x="908" y="205" class="number" text-anchor="middle">5.3421631</text><text x="908" y="244" class="threshold" text-anchor="middle">reported</text><text class="note" x="48" y="333">Source: results/qualcomm-validation/summary.json · correlation and normalized RMSE use predeclared acceptance gates</text></svg>
