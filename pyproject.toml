[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "buildmesh"
version = "0.1.0"
description = "Local-first construction intelligence with an auditable project graph."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "BuildMesh Contributors" }]
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "pypdf>=5.0,<7.0",
  "python-multipart>=0.0.9,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
snapdragon = [
  "numpy>=1.26,<3.0",
  "Pillow>=10.0,<12.0",
  "onnxruntime-qnn>=1.19; platform_system == 'Windows'",
]
vision = ["ultralytics>=8.3,<9.0"]

[project.scripts]
buildmesh = "buildmesh.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/buildmesh"]
include = ["src/buildmesh/static/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
